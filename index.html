    <!-- Deferred third-party loader.
         =====================================================================
         Measured on Slow 4G: Google (gtm.js 127 kB + gtag/js 173 kB) and the
         OpenAI SDK (28 kB) are 328 kB of the ~500 kB of third-party script on
         a landing page, and at 1.6 Mbps that is well over a second of pipe
         taken from the hero image while a visitor is deciding whether to
         stay. None of them need to run before the page is on screen.

         What is NOT deferred, deliberately: the Meta pixel. Its PageView is
         what Meta counts as a landing page view — the exact number this work
         exists to improve — so it stays inline and immediate, with a
         preconnect ahead of it.

         No event is lost. Each vendor's queue (dataLayer, oaiq's q, the gtag
         shim) is created synchronously below, exactly as its own snippet
         would, so anything the app reports before the SDK arrives is held and
         replayed when it does. Only the script element's insertion waits.

         Whichever of these happens first wins:
           · the visitor touches, scrolls, taps or types
           · the window load event
           · a 3.5 s ceiling, so a visitor who reads without moving is still
             measured, and so a resource that never finishes cannot strand
             the load event forever. -->
    <script>
      (function (w, d) {
        var pending = [];
        var done = false;
        var EVENTS = ["pointerdown", "keydown", "touchstart", "scroll", "wheel"];

        function run() {
          if (done) return;
          done = true;
          for (var i = 0; i < EVENTS.length; i++) {
            w.removeEventListener(EVENTS[i], run, true);
          }
          w.removeEventListener("load", run);
          for (var j = 0; j < pending.length; j++) insert(pending[j]);
          pending.length = 0;
        }

        function insert(src) {
          var el = d.createElement("script");
          el.async = true;
          el.src = src;
          var first = d.getElementsByTagName("script")[0];
          first.parentNode.insertBefore(el, first);
        }

        // Queue a script until the page has had its chance to paint.
        w.rayaDefer = function (src) {
          if (done) insert(src);
          else pending.push(src);
        };

        for (var i = 0; i < EVENTS.length; i++) {
          // Capture phase, so a handler that stops propagation cannot hide
          // the interaction from us; passive, so we never delay a scroll.
          w.addEventListener(EVENTS[i], run, { capture: true, passive: true });
        }
        if (d.readyState === "complete") w.setTimeout(run, 0);
        else w.addEventListener("load", run);
        w.setTimeout(run, 3500);
      })(window, document);
    </script>

    <!-- End Google Tag Manager -->

    <!-- OpenAI / ChatGPT Ads pixel (OAIQ), pixel P2hrm2618T2J6j8wrHQtpP.
         The queue and the init call are byte-equivalent to the snippet the
         ads dashboard issues — w.oaiq still exists synchronously and still
         buffers into q.q, so a measure() fired before the SDK lands is
         replayed when it loads. The one change is that the SDK script
         element goes through rayaDefer instead of being inserted at once. Still
         exactly once per page. -->
    <script>!function(w,u){if(w.oaiq)return;var q=function(){q.q.push(arguments)};q.q=[];w.oaiq=q;w.rayaDefer(u)}(window,"https://bzrcdn.openai.com/sdk/oaiq.min.js");oaiq("init",{pixelId:"P2hrm2618T2J6j8wrHQtpP",debug:false});</script>
    <!-- End OpenAI Ads pixel -->

    <!-- No preconnect to connect.facebook.net on purpose. Measured over three
         throttled runs each, with and without: fbevents.js starts at 199 ms
         either way, finishes at 1581 vs 1575 ms, and PageView fires at 1674
         vs 1702 ms — all inside the run-to-run spread. The pixel's own
         snippet is inline in the head and inserts its script element during
         parse, so the connection is already being opened by the time a hint
         could have warmed it. An unused preconnect just holds a socket. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />

    <!-- The content query goes to apicdn.sanity.io, a different host from the
         image CDN and previously not preconnected — so every page paid a cold
         DNS + TCP + TLS handshake on the critical path before the first byte
         of content. Nothing renders until this answers. -->
    <link rel="preconnect" href="https://q2yxl7gs.apicdn.sanity.io" crossorigin />

    <!-- Fonts load without blocking the first paint. The stylesheet itself
         was render-blocking for ~870 ms on Slow 4G: a whole round trip to a
         third origin before a single pixel. `media="print"` makes the browser
         fetch it at low priority and not block on it; onload flips it to
         `all`. display=swap means text is painted in the fallback face
         immediately and re-painted when the webfont arrives, so nothing is
         invisible in the meantime.

         Only the weights the CSS actually asks for are requested. Cormorant
         carries the display headings at 300/400 plus the one italic; Inter
         covers body text at 300/400/500. The 600 and 700 cuts were being
         downloaded and never used. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500&display=swap"
      />
    </noscript>

    <script>

    <!-- Clock WBE → GA4 ecommerce tracking (per the SEO consultant).
         The Clock integration script (loaded in <head>) calls this global
         callback on every page change inside the booking overlay; on the
         "completed" page it reports a GA4 purchase with the booking
         number as transaction_id. Runs on the parent page by design —
         gtag only exists here, not inside Clock's iframe. -->
    <script>
      // Fires once, the first time the booking overlay opens. The callback
      // below runs on EVERY page change inside the overlay, so without this
      // guard each step of the funnel would report another ad conversion.
      var oaiqCheckoutStarted = false;

      // ChatGPT Ads + GA4. Unchanged behaviour, lifted into its own function
      // so the Meta block below cannot take it down — and vice versa.
      function rayaClockReportGoogle(p) {
        if (!oaiqCheckoutStarted && typeof window.oaiq === 'function') {
          oaiqCheckoutStarted = true;
          window.oaiq('measure', 'checkout_started', { type: 'contents' });
        }

        gtag('event', 'page_view', {
          page_title: ['BookDirect', p.hotelName, p.pageName].join(' / ')
        });

        // Start of Custom Tracking Script
        if (p.pageName === 'completed') {
          gtag('event', 'purchase', {
            page_title: ['BookDirect', p.hotelName, p.pageName].join(' / '),
            currency: p.totalPriceCurrency,
            transaction_id: p.bookingNumbers.join('-'),
            value: (p.totalPriceCents / 100).toString(),
            items: [
              {
                item_name: 'Accommodation',
                item_category: p.stay,
                item_category2: p.arrival,
                item_category3: p.departure,
              },
            ],
          });
        }
        // End of Custom Tracking Script
      }

      // Meta Pixel booking funnel.
      //
      // This has to live here rather than in the React bundle: Clock's
      // integration script is deferred, and it only registers a callback
      // that already exists when it runs. A classic inline script in the
      // body runs during parsing, so it is defined first; /src/main.jsx is
      // type="module" and therefore also deferred, which would race it.
      //
      // PageView is deliberately absent — Layout.jsx already fires one per
      // route change, and the overlay does not change the route.
      function rayaClockReportMeta(p) {
        if (typeof window.fbq !== 'function') return;

        // totalPriceCents is CENTS. 9900 is 99.00, and sending 9900 as the
        // value would inflate reported revenue a hundredfold.
        var amount = (typeof p.totalPriceCents === 'number')
          ? p.totalPriceCents / 100
          : null;
        var currency = p.totalPriceCurrency || 'EUR';

        // bookingNumbers is an ARRAY, and may be absent on every step but
        // the last one.
        var ids = [];
        if (p.bookingNumbers && p.bookingNumbers.length) {
          for (var i = 0; i < p.bookingNumbers.length; i++) {
            ids.push(String(p.bookingNumbers[i]));
          }
        }

        function send(event, extra, eventID) {
          var payload = { content_type: 'hotel_room' };
          if (p.arrival) payload.checkin_date = p.arrival;
          if (p.departure) payload.checkout_date = p.departure;
          var e = extra || {};
          for (var k in e) {
            if (!Object.prototype.hasOwnProperty.call(e, k)) continue;
            // Meta renders null and "" as real values in Events Manager,
            // which makes a healthy event look broken.
            if (e[k] === null || e[k] === undefined || e[k] === '') continue;
            payload[k] = e[k];
          }
          if (eventID) window.fbq('track', event, payload, { eventID: eventID });
          else window.fbq('track', event, payload);
        }

        switch (p.pageName) {
          case 'rooms':
            send('Search');
            break;
          case 'rates':
            send('ViewContent', {
              content_name: p.roomTypeName,
              content_ids: p.roomTypeName ? [p.roomTypeName] : null
            });
            break;
          case 'extras':
            send('AddToCart', {
              content_name: p.roomTypeName,
              content_ids: p.roomTypeName ? [p.roomTypeName] : null
            });
            break;
          case 'checkout':
            send('InitiateCheckout', {
              value: amount,
              currency: currency,
              num_items: p.roomCount
            });
            rayaClockCheckoutStarted(p);
            break;
          case 'completed':
            // Deterministic eventID rather than a UUID: the same booking
            // reported later by the Conversions API carries the same id and
            // is deduplicated instead of counted twice. Once per booking —
            // rayaClockPurchaseOnce() is shared with the message listener and
            // the confirmation-URL check below, whichever sees it first.
            rayaClockPurchaseOnce(ids, function (eventID) {
              send('Purchase', {
                value: amount,
                currency: currency,
                content_ids: ids.length ? ids : null,
                num_items: p.roomCount
              }, eventID);
            }, {
              value: amount, currency: currency, num_items: p.roomCount,
              checkin_date: p.arrival, checkout_date: p.departure,
              fromCallback: true
            });
            break;
          case 'offer':
            // A room booking request the guest submitted inside Clock — the
            // booking engine is rooms only, so its category is always hotel.
            send('Lead', {
              content_name: 'Clock offer',
              content_category: 'hotel',
              content_ids: p.offerNumber ? [String(p.offerNumber)] : null
            });
            break;
        }
      }

      // ── Booking state shared by every way a booking can be seen ───────
      //
      // A confirmed booking reaches this page three ways: Clock calls the
      // callback below (pageName "completed"), the same news arrives as a
      // postMessage from Clock's iframe, and the iframe may report a
      // confirmation URL. Purchase must be sent once per booking whichever
      // comes first, so all three go through rayaClockPurchaseOnce(), which
      // remembers the booking in sessionStorage. See README-tracking.md.
      var RAYA_CLOCK_ORIGIN = /^https:\/\/[a-z0-9-]+\.clock-software\.com$/;
      var RAYA_PURCHASED = 'raya.clock.purchased';
      var RAYA_CHECKOUT = 'raya.clock.checkout';

      function rayaStore(key, value) {
        try {
          if (value === undefined) {
            var raw = window.sessionStorage.getItem(key);
            return raw ? JSON.parse(raw) : null;
          }
          window.sessionStorage.setItem(key, JSON.stringify(value));
        } catch (e) { /* private mode, blocked storage: no memory, no harm */ }
        return null;
      }

      // ?debugclock=1 logs every message from Clock's iframe with its full
      // payload. Kept for the tab's visit, since the SPA drops the query on
      // navigation; ?debugclock=0 turns it off. ?meta_test=TEST12345 sends
      // the Conversions API copy to Events Manager → Test Events.
      (function () {
        try {
          var q = new URLSearchParams(window.location.search);
          if (q.get('debugclock') === '1') window.sessionStorage.setItem('raya.clock.debug', '1');
          if (q.get('debugclock') === '0') window.sessionStorage.removeItem('raya.clock.debug');
          var t = q.get('meta_test');
          if (t && /^TEST[A-Za-z0-9]{1,20}$/.test(t)) window.sessionStorage.setItem('raya.meta.testCode', t);
        } catch (e) { /* ignore */ }
      })();
      function rayaClockDebug() {
        try { return window.sessionStorage.getItem('raya.clock.debug') === '1'; } catch (e) { return false; }
      }
      function rayaClockLog() {
        if (!rayaClockDebug() || !window.console) return;
        var args = ['%c[clock]', 'color:#b8860b;font-weight:bold'];
        for (var i = 0; i < arguments.length; i++) args.push(arguments[i]);
        console.log.apply(console, args);
      }

      // The checkout in progress: what InitiateCheckout reported, kept so a
      // confirmation that arrives without a price (a URL) can still carry
      // one, and so closing the overlay can tell an abandoned checkout.
      function rayaClockCheckoutStarted(p) {
        var c = rayaStore(RAYA_CHECKOUT);
        if (!c || c.done) {
          c = { token: Date.now().toString(36) + Math.random().toString(36).slice(2, 8) };
        }
        if (typeof p.totalPriceCents === 'number') c.value = p.totalPriceCents / 100;
        if (p.totalPriceCurrency) c.currency = p.totalPriceCurrency;
        if (p.roomCount) c.num_items = p.roomCount;
        if (p.arrival) c.checkin_date = p.arrival;
        if (p.departure) c.checkout_date = p.departure;
        rayaStore(RAYA_CHECKOUT, c);
      }

      // Calls send(eventID) once per booking, then posts the same event to
      // the Conversions API. A booking without numbers is keyed on the
      // checkout it ended, and skips the Conversions API: without a stable
      // id the two copies could not be matched, and would count twice.
      function rayaClockPurchaseOnce(ids, send, data) {
        var checkout = rayaStore(RAYA_CHECKOUT);
        var key = ids.length ? 'clock-' + ids.join('-')
          : checkout && !checkout.done ? 'clock-checkout-' + checkout.token : null;
        if (!key) {
          // Clock's callback sent Purchase here before this guard existed,
          // and still does; the other two ways need something to key on.
          if (data.fromCallback) {
            send(null);
            return true;
          }
          rayaClockLog('confirmation without a booking number or a checkout — no Purchase');
          return false;
        }
        var sent = rayaStore(RAYA_PURCHASED) || [];
        if (sent.indexOf(key) !== -1) {
          rayaClockLog('Purchase already sent for', key);
          return false;
        }
        sent.push(key);
        rayaStore(RAYA_PURCHASED, sent.slice(-20));
        if (checkout) {
          checkout.done = 'purchase';
          rayaStore(RAYA_CHECKOUT, checkout);
        }
        send(ids.length ? key : null);
        rayaClockLog('Purchase sent', key, data);
        if (ids.length) rayaClockCapi(key, ids, data);
        return true;
      }

      function rayaClockCapi(eventID, ids, data) {
        try {
          if (typeof data.value !== 'number' || !(data.value > 0)) return;
          var body = {
            event_name: 'Purchase',
            event_id: eventID,
            content_ids: ids,
            value: data.value,
            currency: data.currency || 'EUR',
            event_source_url: window.location.href.split('#')[0]
          };
          if (data.num_items) body.num_items = data.num_items;
          if (data.checkin_date) body.checkin_date = data.checkin_date;
          if (data.checkout_date) body.checkout_date = data.checkout_date;
          try {
            var t = window.sessionStorage.getItem('raya.meta.testCode');
            if (t) body.test_event_code = t;
          } catch (e) { /* ignore */ }
          window.fetch('/api/meta-capi.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            keepalive: true,
            credentials: 'same-origin'
          }).then(function (r) { return r.json(); })
            .then(function (j) { rayaClockLog('Conversions API', j); })
            .catch(function (err) { rayaClockLog('Conversions API failed', err); });
        } catch (err) {
          if (window.console) console.error('[clock->capi]', err);
        }
      }

      // The confirmed booking in an arbitrary message, if there is one:
      // booking numbers, a confirmed status or Clock's "completed" page, and
      // a total. Clock's own "track" message has the callback's shape; the
      // rest is a search, in case Clock sends a confirmation some other way.
      var RAYA_ID_KEY = /^(booking|reservation|confirmation|order)_?(numbers?|ids?|refs?|references?|codes?)$|^bookingNumbers$/i;
      function rayaClockFindBooking(data) {
        var found = { ids: [], status: null, amount: null, currency: null, pageName: null };
        var seen = 0;
        (function walk(v, depth) {
          if (!v || typeof v !== 'object' || depth > 5 || seen++ > 500) return;
          for (var k in v) {
            if (!Object.prototype.hasOwnProperty.call(v, k)) continue;
            var x = v[k];
            if (RAYA_ID_KEY.test(k)) {
              var list = Array.isArray(x) ? x : [x];
              for (var i = 0; i < list.length; i++) {
                if ((typeof list[i] === 'string' || typeof list[i] === 'number') && /^[A-Za-z0-9_.-]{1,40}$/.test(String(list[i])) &&
                    found.ids.indexOf(String(list[i])) === -1) found.ids.push(String(list[i]));
              }
            } else if (/^(status|state|bookingStatus|reservationStatus)$/i.test(k) && typeof x === 'string') {
              found.status = found.status || x;
            } else if (k === 'pageName' && typeof x === 'string') {
              found.pageName = found.pageName || x;
            } else if (/cents$/i.test(k) && /total|price|amount/i.test(k) && typeof x === 'number') {
              if (found.amount === null) found.amount = x / 100;
            } else if (/^(total|totalPrice|totalAmount|amount|grandTotal)$/i.test(k) && typeof x === 'number') {
              if (found.amount === null) found.amount = x;
            } else if (/currency$/i.test(k) && typeof x === 'string' && /^[A-Z]{3}$/.test(x)) {
              found.currency = found.currency || x;
            } else if (typeof x === 'object') {
              walk(x, depth + 1);
            }
          }
        })(data, 0);
        found.confirmed = found.pageName === 'completed' ||
          /^(confirmed|success|succeeded|successful|completed|booked|paid)$/i.test(found.status || '');
        return found;
      }

      // A confirmation page by its URL — the iframe's path, which Clock
      // reports as windowLocationReplace and mirrors into ?clock-pms-wbe=,
      // or this page's own, should a payment step ever land the guest on a
      // thank-you URL here. Booking numbers are taken from the URL where it
      // has them; the price from the checkout that preceded it.
      var RAYA_CONFIRM_URL = /(booking-?)?(completed|confirmation|confirmed|success|thank-?you|thanks)(\/|$|\?|#|&)/i;
      function rayaClockCheckUrl(href, how) {
        var url;
        try { url = new URL(href, window.location.href); } catch (e) { return; }
        var wbe = url.searchParams.get('clock-pms-wbe') || '';
        var paths = [wbe, url.pathname, url.hash.slice(1)];
        var hit = null;
        for (var i = 0; i < paths.length; i++) {
          if (paths[i] && RAYA_CONFIRM_URL.test(paths[i])) { hit = paths[i]; break; }
        }
        if (!hit) return;
        var ids = [];
        var params = [url.searchParams];
        var q = hit.indexOf('?');
        if (q !== -1) params.push(new URLSearchParams(hit.slice(q + 1)));
        for (var j = 0; j < params.length; j++) {
          params[j].forEach(function (v, k) {
            if (RAYA_ID_KEY.test(k.replace(/[-\[\]]/g, '_').replace(/_+$/, ''))) {
              String(v).split(/[,\s]+/).forEach(function (id) {
                if (/^[A-Za-z0-9_.-]{1,40}$/.test(id) && ids.indexOf(id) === -1) ids.push(id);
              });
            }
          });
        }
        var m = /(completed|confirmation|confirmed|success)\/([A-Za-z0-9_.-]{3,40})/i.exec(hit);
        if (!ids.length && m) ids.push(m[2]);
        rayaClockLog('confirmation URL (' + how + ')', href, ids);
        rayaClockPurchaseFrom({ ids: ids }, 'url');
      }

      // Purchase from a message or a URL: the same event the callback sends,
      // with order_id, and only if the callback has not sent it already.
      function rayaClockPurchaseFrom(found, how) {
        if (typeof window.fbq !== 'function') return;
        var checkout = rayaStore(RAYA_CHECKOUT) || {};
        var data = {
          value: found.amount !== null && found.amount !== undefined ? found.amount : checkout.value,
          currency: found.currency || checkout.currency || 'EUR',
          num_items: checkout.num_items,
          checkin_date: checkout.checkin_date,
          checkout_date: checkout.checkout_date
        };
        rayaClockPurchaseOnce(found.ids, function (eventID) {
          var payload = { content_type: 'hotel_room', currency: data.currency };
          if (typeof data.value === 'number') payload.value = data.value;
          if (found.ids.length) {
            payload.content_ids = found.ids;
            payload.order_id = found.ids.join('-');
          }
          if (data.num_items) payload.num_items = data.num_items;
          if (data.checkin_date) payload.checkin_date = data.checkin_date;
          if (data.checkout_date) payload.checkout_date = data.checkout_date;
          if (eventID) window.fbq('track', 'Purchase', payload, { eventID: eventID });
          else window.fbq('track', 'Purchase', payload);
          rayaClockLog('Purchase from ' + how, payload);
        }, data);
      }

      // BookingCheckoutAbandon: the overlay closed after InitiateCheckout
      // and before a Purchase. Once per checkout.
      function rayaClockClosed() {
        var c = rayaStore(RAYA_CHECKOUT);
        if (!c || c.done) return;
        c.done = 'abandon';
        rayaStore(RAYA_CHECKOUT, c);
        if (typeof window.fbq !== 'function') return;
        var payload = { content_type: 'hotel_room', currency: c.currency || 'EUR' };
        if (typeof c.value === 'number') payload.value = c.value;
        if (c.num_items) payload.num_items = c.num_items;
        if (c.checkin_date) payload.checkin_date = c.checkin_date;
        if (c.checkout_date) payload.checkout_date = c.checkout_date;
        window.fbq('trackCustom', 'BookingCheckoutAbandon', payload, { eventID: 'clock-abandon-' + c.token });
        rayaClockLog('BookingCheckoutAbandon', payload);
      }

      // Every message from Clock's iframe. Clock's own listener answers them;
      // this one only watches. Its own failures stay inside it.
      window.addEventListener('message', function (event) {
        try {
          if (!RAYA_CLOCK_ORIGIN.test(event.origin || '')) return;
          var d = event.data;
          if (!d || typeof d !== 'object') return;
          rayaClockLog(d.type || '(reply #' + d.id + ')', d);
          if (d.type === 'integrationClose') {
            rayaClockClosed();
            return;
          }
          if (d.type === 'windowLocationReplace' && typeof d.payload === 'string') {
            rayaClockCheckUrl(d.payload, 'iframe');
            return;
          }
          if (!d.type) return; // a reply to one of the page's own requests
          var found = rayaClockFindBooking(d.payload);
          // "track" "checkout" is InitiateCheckout's: the callback records
          // it, and does so again here only if Clock never called it.
          if (d.type === 'track' && d.payload && d.payload.pageName === 'checkout') {
            var c = rayaStore(RAYA_CHECKOUT);
            if (!c || c.done) rayaClockCheckoutStarted(d.payload);
          }
          if (found.confirmed && (found.ids.length || found.pageName === 'completed')) {
            // After Clock's own listener, so its callback goes first when
            // both run; whichever does, the booking is sent once.
            setTimeout(function () { rayaClockPurchaseFrom(found, 'message'); }, 0);
          }
        } catch (err) {
          if (window.console) console.error('[clock->message]', err);
        }
      }, false);

      // A confirmation URL this page was opened on.
      try { rayaClockCheckUrl(window.location.href, 'page'); } catch (e) { /* ignore */ }

      window.clockPmsWbePageViewCallback = function (params) {
        var p = params || {};
        rayaClockLog('callback', p);
        // Isolated: a throw in one reporter must not stop the others. The
        // Google block in particular reads params.bookingNumbers.join(),
        // which would throw if Clock ever omitted it.
        try {
          rayaClockReportGoogle(p);
        } catch (err) {
          if (window.console) console.error('[clock->google]', err);
        }
        try {
          rayaClockReportMeta(p);
        } catch (err) {
          if (window.console) console.error('[clock->meta]', err);
        }
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
