name: Build & deploy to SuperHosting

# Push to main → build the static site → FTP-sync dist/ to SuperHosting.
# Sanity content is fetched in the browser at runtime, so content edits in
# Studio go live with no rebuild — this only runs when the code changes.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab
  # Content-only refresh. sitemap.xml and the bot snapshots are generated at
  # build time from Sanity, so publishing an event has to rebuild to reach
  # them — a Sanity webhook posting repository_dispatch (type
  # "sanity-content-published") makes that automatic. See
  # README-sitemap.md for the webhook setup.
  repository_dispatch:
    types: [sanity-content-published]

concurrency:
  group: deploy-superhosting
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Skip the FTP step until the credentials are configured, so the first
    # push (before secrets exist) still builds green instead of failing red.
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # These VITE_* values are public client config (they ship inside the
        # JS bundle either way), so they live here rather than in secrets.
        env:
          VITE_SANITY_PROJECT_ID: q2yxl7gs
          VITE_SANITY_DATASET: production
          VITE_FORMSPREE_ENDPOINT: https://formspree.io/f/mvzlnlav
        run: npm run build

      # Re-renders the /events brochure covers from page 1 of whatever
      # PDFs are uploaded in Studio, over the committed public/img copies.
      # Swapping a brochure in Sanity therefore refreshes its cover on the
      # next deploy, with no code change. Never blocks the deploy: the
      # script keeps the committed cover and exits 0 on any failure.
      - name: Render brochure covers from the PDFs
        continue-on-error: true
        env:
          VITE_SANITY_PROJECT_ID: q2yxl7gs
          VITE_SANITY_DATASET: production
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm run covers:pdf

      # sitemap.xml is generated, not hand-maintained: the static routes plus
      # one URL per published Sanity document that owns a route (today:
      # eventPage → /event/<slug>), in all three languages with hreflang
      # alternates. There is no checked-in copy to fall back to — this is
      # the only place the file comes from.
      #
      # Deliberately NOT continue-on-error, unlike the steps around it. The
      # deploy below mirrors with --delete, so shipping a dist/ with no
      # sitemap.xml would delete the live one. Failing here stops the job
      # before the mirror runs and leaves the deployed sitemap in place.
      - name: Generate sitemap.xml from Sanity
        env:
          VITE_SANITY_PROJECT_ID: q2yxl7gs
          VITE_SANITY_DATASET: production
        run: npm run sitemap

      # Renders a static HTML snapshot of each page (via a headless
      # Chromium + Sanity fetch) into dist/__snapshots__/. public/.htaccess
      # serves these to bot user agents (GPTBot, ChatGPT-User, Googlebot...)
      # that don't run JavaScript, since the built index.html is otherwise
      # just an empty <div id="root"></div> until React renders client-side.
      # Never blocks the deploy: the script itself swallows its own errors
      # and exits 0, and continue-on-error is a second safety net — bots
      # just fall back to today's behaviour if a snapshot is missing.
      - name: Prerender pages for crawlers
        continue-on-error: true
        env:
          VITE_SANITY_PROJECT_ID: q2yxl7gs
          VITE_SANITY_DATASET: production
        run: npm run prerender:bots

      # What the snapshots actually say, from real Sanity data, before they
      # are uploaded. CI cannot reach the live site — the host drops TCP
      # from Actions runners (see .github/workflows/og-check.yml) — so this
      # cannot prove Apache serves the right file to the right crawler. It
      # does prove the file is right, which is the half CI can see, and the
      # half a stubbed local test can only approximate.
      #
      # Informational: a wrong og:locale is worth shouting about but not
      # worth blocking a deploy over.
      - name: Check the built share cards
        continue-on-error: true
        env:
          VITE_SANITY_PROJECT_ID: q2yxl7gs
          VITE_SANITY_DATASET: production
          SNAPSHOT_DIR: dist/__snapshots__
        run: node scripts/check-og-cards.mjs

      # Deploy with lftp over explicit FTPS, in an order that never leaves the
      # live site half-deployed: assets/ first (nothing deleted, every file
      # checked on the server), then everything else, index.html last, then
      # prune chunks older than the previous build. scripts/deploy-ftp.sh
      # explains each step, the FTPS settings, the serial transfers and why
      # api/error_log is never touched.
      - name: Deploy to SuperHosting via FTPS (lftp)
        if: ${{ env.HAS_FTP == 'true' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_SERVER_DIR || 'rayagarden.bg/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          bash scripts/deploy-ftp.sh
