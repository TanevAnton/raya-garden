name: Check share cards

# Fetches the live site as Facebook's scraper and checks each language gets
# its own card. Nothing else can prove this: the snapshots and the .htaccess
# rules that route to them only mean something as Apache runtime behaviour,
# and a build cannot observe its own deployment.
#
# Read-only and credential-free — an ordinary public GET with a spoofed
# User-Agent. Safe to run at any time; it deploys nothing.

# ⚠ THE HOST BLOCKS GITHUB'S RUNNERS. Measured 2026-09-21: TCP connections
# from an Actions runner to 78.128.8.72 time out on both 443 and 80, before
# any TLS or HTTP exchange — DNS resolves fine, and the User-Agent is never
# sent, so it is the source address being dropped, not the caller's identity.
# SuperHosting appears to refuse datacenter ranges.
#
# So this cannot run after a deploy: it would fail every time and teach
# everyone to ignore a red X. It stays dispatch-only, for the day that
# changes. Facebook's own scrapers come from Facebook's ranges and are not
# affected by this — see README-sitemap.md for how to verify the cards
# instead (the Sharing Debugger, which scrapes from Facebook's side).
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Comma-separated paths to check"
        default: "/event/nova-godina-2027"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runs first and never fails the job: when the check below cannot
      # reach the site, this says whether it is DNS, TCP, TLS, or the host
      # refusing this particular caller — and whether the spoofed
      # User-Agent is itself the reason, which would mean Facebook cannot
      # scrape the site at all.
      - name: Diagnose connectivity
        continue-on-error: true
        run: |
          set +e
          echo "=== DNS ==="
          getent hosts rayagarden.bg || echo "(getent found nothing)"
          echo
          echo "=== HEAD / with curl's own UA ==="
          curl -sS -o /dev/null -w "  http_code=%{http_code} time=%{time_total}s\n" \
            --max-time 25 "https://rayagarden.bg/"; echo "  exit=$?"
          echo
          echo "=== GET the event page as facebookexternalhit ==="
          curl -sS -o /dev/null -w "  http_code=%{http_code} time=%{time_total}s\n" \
            --max-time 25 -A "facebookexternalhit/1.1" \
            "https://rayagarden.bg/event/nova-godina-2027?lang=ro"; echo "  exit=$?"
          echo
          echo "=== verbose handshake ==="
          curl -sS -v --max-time 25 -o /dev/null \
            "https://rayagarden.bg/" 2>&1 | tail -20
          echo
          echo "=== plain HTTP (is it TLS-specific?) ==="
          curl -sS -o /dev/null -w "  http_code=%{http_code}\n" \
            --max-time 20 "http://rayagarden.bg/"; echo "  exit=$?"

      # Interpolated through env, never into the shell command itself.
      - name: Fetch as facebookexternalhit
        env:
          CHECK_PATHS: ${{ inputs.paths || '/event/nova-godina-2027' }}
        run: node scripts/check-og-cards.mjs
